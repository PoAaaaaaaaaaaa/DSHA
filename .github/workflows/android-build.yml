name: Android 构建

# 云端构建要先补齐三份被 .gitignore 排除的离线资产，全部落在 Release 标签 ASSET_TAG 上：
#   1. offline-rootfs.bin        85 MiB  仓库里没有生成脚本 —— 只能以资产形式提供
#   2. ubuntu-tools.bin          18 MiB  由 packages.lock.json 锁定的 arm64 deb 集合；
#                                        连同 ubuntu-tools.inputs.json 一起取，取不到才现场从
#                                        ports.ubuntu.com 重拉（旧版本 deb 会从 pool 里下架，
#                                        lock 一旦过期这条路就断 —— 所以资产优先）
#   3. dsh-runtime.bin          122 MiB  不进 Release：tools/prepare-dsh-runtime.py 用公开 npm
#                                        的锁文件现场重装，可按锁文件哈希缓存
# 应急运行时 tools/recovery-runtime/archives/*.bin 不用单独提供：prepare-recovery-assets.py
# 会按 lock.json 的 sha256 从上面同摘要的正式归档自行派生。
# 一项都取不到时工作流照常跑，但退化成「精简资产」：能编译、能跑单测，产物不含内置离线环境。
#
# 正式版（release）不在 CI 里打 —— app/build.gradle 的 verifyPublishCertificate 要求
# 历史 E7E3 发布证书（DSHA_KEYSTORE）且证书指纹必须逐位相符，密钥不进 CI。
# 这里只出 debug 包和单测结果。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: 版本
        type: choice
        options: [standard, low]
        default: standard
      skip_apk:
        description: 只跑单测，不打 APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  DSHA_PYTHON: python3
  ASSET_TAG: dsha-offline-assets-v10
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home

jobs:
  build:
    name: ${{ inputs.flavor == 'low' && '兼容版 low' || '标准版 standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 取回离线的内置运行环境
        id: offline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          gh release download "$ASSET_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'offline-rootfs.bin' \
            --pattern 'ubuntu-tools.bin' \
            --pattern 'ubuntu-tools.inputs.json' \
            --dir /tmp/dsha-assets
          cp /tmp/dsha-assets/offline-rootfs.bin        app/src/main/assets/
          cp /tmp/dsha-assets/ubuntu-tools.bin          app/src/main/assets/
          cp /tmp/dsha-assets/ubuntu-tools.inputs.json  app/src/main/assets/
          ls -lh app/src/main/assets/offline-rootfs.bin app/src/main/assets/ubuntu-tools.bin

      - name: 缺离线 rootfs 的提示
        if: steps.offline.outcome != 'success'
        run: |
          echo "::warning::没取到 $ASSET_TAG 的离线资产：本次按精简资产构建，产物不含内置离线环境。"
          echo "::warning::补齐办法：把 offline-rootfs.bin / ubuntu-tools.bin / ubuntu-tools.inputs.json 传到该标签的 Release 上。"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node 24 + npm 11（prepare-dsh-runtime.py 的硬要求）
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 缓存重建好的 dsh 离线运行时
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/dsh-runtime.bin
          key: dsh-runtime-${{ hashFiles('tools/prepare-dsh-runtime.py', 'tools/build-dsh-runtime.py', 'tools/dsh-runtime/package-lock.json') }}

      - name: 重建 dsh 离线运行时
        run: python3 tools/prepare-dsh-runtime.py

      - name: 重建 Ubuntu 离线基础工具
        if: steps.offline.outcome != 'success'
        run: python3 tools/prepare-ubuntu-tools.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 SDK 组件
        # 不用 android-actions/setup-android@v3：它会去装早已下架的旧 `tools` 包，
        # sdkmanager 直接退 1（云端构建第一次就死在这里）。runner 镜像自带 SDK，
        # 自己挑一个能用的 sdkmanager 就够了。
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -x "$SM" || { echo "::error::runner 上没有可用的 sdkmanager"; exit 1; }
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          # compileSdk 37 在 SDK 仓库里可能登记成 android-37.0 或 android-37，两个都试。
          for p in "platforms;android-37.0" "platforms;android-37"; do
            "$SM" --install "build-tools;36.0.0" "ndk;26.3.11579264" "$p" && break
          done
          "$SM" --list_installed | tail -25

      - name: 写 local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: 单测（两个 flavor 都跑）
        run: |
          set -euo pipefail
          ./gradlew :app:testStandardDebugUnitTest :app:testLowDebugUnitTest --no-daemon --stacktrace

      - name: 打 APK
        if: ${{ !inputs.skip_apk }}
        env:
          FLAVOR: ${{ inputs.flavor == 'low' && 'Low' || 'Standard' }}
        run: |
          set -euo pipefail
          ./gradlew ":app:assemble${FLAVOR}Debug" --no-daemon --stacktrace
          find app/build/outputs/apk -name '*.apk' -print -exec ls -lh {} \;

      - name: 收集单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: 收集 APK
        if: ${{ !inputs.skip_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: dsha-apk-${{ inputs.flavor == 'low' && 'low' || 'standard' }}-debug
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30
